<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171717">
  <title>Home</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <main class="auth-card">
    <h1>Welcome</h1>
    <p id="welcomeMessage" class="subtitle">Checking your account...</p>

    <section class="home-biodata">
      <h2 class="biodata-title">My Biodata</h2>

      <div id="biodataView">
        <div class="biodata-container">
          <div class="biodata-item">
            <span class="biodata-label">Username</span>
            <span class="biodata-value" id="profileUsername">Loading...</span>
          </div>
          <div class="biodata-item">
            <span class="biodata-label">Email</span>
            <span class="biodata-value" id="profileEmail">Loading...</span>
          </div>
          <div class="biodata-item">
            <span class="biodata-label">Birthday</span>
            <span class="biodata-value" id="profileBirthday">Loading...</span>
          </div>
          <div class="biodata-item">
            <span class="biodata-label">Gender</span>
            <span class="biodata-value" id="profileGender">Loading...</span>
          </div>
        </div>
        <button id="editButton" type="button" class="secondary-button">Edit Info</button>
      </div>

      <form id="editForm" hidden novalidate>
        <label for="editUsername">Username</label>
        <input id="editUsername" type="text" autocomplete="username">
        <small id="editUsernameError" class="field-error"></small>

        <label for="editBirthday">Birthday</label>
        <input id="editBirthday" type="date">
        <small id="editBirthdayError" class="field-error"></small>

        <label for="editGender">Gender</label>
        <select id="editGender">
          <option value="">-- Select Gender --</option>
          <option>Male</option>
          <option>Female</option>
          <option>Prefer not to say</option>
        </select>
        <small id="editGenderError" class="field-error"></small>

        <button id="saveButton" type="submit">Save Changes</button>
        <button id="cancelButton" type="button" class="secondary-button">Cancel</button>
      </form>

      <p id="homeMessage" class="form-message" role="status" aria-live="polite"></p>
      <button id="logoutButton" type="button">Log Out</button>
    </section>
  </main>

  <script type="module">
    import { auth, db } from "./firebase-config.js";
    import { onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
    import { doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

    const $ = id => document.getElementById(id);
    const msg = $("homeMessage");
    const today = new Date().toISOString().slice(0, 10);
    $("editBirthday").max = today;

    let currentUser = null;
    let profile = { username: "", birthday: "", gender: "" };

    const show = (text, ok = false) => {
      msg.className = "form-message " + (ok ? "success-message" : "error-message");
      msg.textContent = text;
    };

    function formatDate(value) {
      if (!value) return "Not provided";
      const [y, m, d] = value.split("-").map(Number);
      const date = new Date(y, m - 1, d);
      return isNaN(date) ? value : date.toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });
    }

    function render() {
      $("profileUsername").textContent = profile.username || "Not provided";
      $("profileEmail").textContent = currentUser.email || "Not provided";
      $("profileBirthday").textContent = formatDate(profile.birthday);
      $("profileGender").textContent = profile.gender || "Not provided";
      $("welcomeMessage").textContent = You are signed in${profile.username ? ", " + profile.username : ""}.;
    }

    function setEditing(editing) {
      $("biodataView").hidden = editing;
      $("editForm").hidden = !editing;
    }

    onAuthStateChanged(auth, async user => {
      if (!user) {
        window.location.replace("login.html");
        return;
      }
      currentUser = user;
      profile.username = user.displayName || "";

      try {
        const snapshot = await getDoc(doc(db, "users", user.uid));
        if (!auth.currentUser || auth.currentUser.uid !== user.uid) return;

        if (snapshot.exists()) {
          const data = snapshot.data();
          profile = {
            username: data.username || user.displayName || "",
            birthday: data.birthday || "",
            gender: data.gender || ""
          };
        } else {
          show("No saved details yet. Tap Edit Info to add them.");
        }
      } catch (error) {
        console.error("Error loading biodata:", error);
        show("Could not load your biodata. Please check your internet connection and Firestore security rules.");
      }
      render();
    });

    $("editButton").addEventListener("click", () => {
      msg.textContent = "";
      $("editUsername").value = profile.username;
      $("editBirthday").value = profile.birthday;
      $("editGender").value = profile.gender;
      ["Username", "Birthday", "Gender"].forEach(name => ($("edit" + name + "Error").textContent = ""));
      setEditing(true);
    });

    $("cancelButton").addEventListener("click", () => setEditing(false));

    $("editForm").addEventListener("submit", async event => {
      event.preventDefault();
      const username = $("editUsername").value.trim();
      const birthday = $("editBirthday").value;
      const gender = $("editGender").value;

      const errors = {
        Username: /^\w{8,}$/.test(username) ? "" : "Use at least 8 letters, numbers, or _.",
        Birthday: birthday && birthday >= "1900-01-01" && birthday <= today ? "" : "Enter a valid birthday.",
        Gender: gender ? "" : "Select your gender."
      };
      Object.entries(errors).forEach(([name, text]) => ($("edit" + name + "Error").textContent = text));
      if (Object.values(errors).some(Boolean)) return;

      const saveButton = $("saveButton");
      saveButton.disabled = true;
      saveButton.textContent = "Saving...";

      try {
        await setDoc(doc(db, "users", currentUser.uid), {
          username, birthday, gender,
          email: currentUser.email,
          updatedAt: serverTimestamp()
        }, { merge: true });
        await updateProfile(currentUser, { displayName: username });

        profile = { username, birthday, gender };
        render();
        setEditing(false);
        show("Your info was updated.", true);
      } catch (error) {
        console.error("Save error:", error);
        show("Could not save your changes. Please try again.");
      }

      saveButton.disabled = false;
      saveButton.textContent = "Save Changes";
    });

    $("logoutButton").addEventListener("click", async () => {
      const button = $("logoutButton");
      button.disabled = true;
      button.textContent = "Logging out...";

      try {
        await signOut(auth);
        sessionStorage.removeItem("loggedInUid");
        window.location.href = "login.html";
      } catch (error) {
        console.error("Logout error:", error);
        show("Could not log out. Please try again.");
        button.disabled = false;
        button.textContent = "Log Out";
      }
    });
  </script>
</body>
</html>
