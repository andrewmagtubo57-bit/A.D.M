  </main>

  <script type="module">
    import { auth, db } from "./firebase-config.js";

    import {
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

    import {
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

    const welcome = document.getElementById("welcomeMessage");
    const message = document.getElementById("homeMessage");
    const logoutButton = document.getElementById("logoutButton");

    const profileUsername = document.getElementById("profileUsername");
    const profileEmail = document.getElementById("profileEmail");
    const profileBirthday = document.getElementById("profileBirthday");
    const profileGender = document.getElementById("profileGender");

    onAuthStateChanged(auth, async user => {
      if (!user) {
        window.location.replace("login.html");
        return;
      }

      welcome.textContent = `You are signed in${user.displayName ? ", " + user.displayName : ""}.`;

      try {
        const profileRef = doc(db, "users", user.uid);
        const profileSnapshot = await getDoc(profileRef);

        // Don't display data if the signed-in user changed during loading.
        if (!auth.currentUser || auth.currentUser.uid !== user.uid) {
          return;
        }

        if (profileSnapshot.exists()) {
          const profile = profileSnapshot.data();

          profileUsername.textContent =
            profile.username || user.displayName || "Not provided";

          profileEmail.textContent =
            user.email || profile.email || "Not provided";

          profileBirthday.textContent =
            profile.birthday || "Not provided";

          profileGender.textContent =
            profile.gender || "Not provided";
        } else {
          profileUsername.textContent = user.displayName || "Not provided";
          profileEmail.textContent = user.email || "Not provided";
          profileBirthday.textContent = "Not provided";
          profileGender.textContent = "Not provided";

          message.textContent = "Your biodata record was not found.";
          message.className = "form-message error-message";
        }
      } catch (error) {
        console.error("Error loading biodata:", error);

        profileUsername.textContent = user.displayName || "Unavailable";
        profileEmail.textContent = user.email || "Unavailable";
        profileBirthday.textContent = "Unavailable";
        profileGender.textContent = "Unavailable";

        message.textContent =
          "Could not load your biodata. Please check your internet connection and Firestore security rules.";

        message.className = "form-message error-message";
      }
    });

    logoutButton.addEventListener("click", async () => {
      logoutButton.disabled = true;
      logoutButton.textContent = "Logging out...";

      try {
        await signOut(auth);
        sessionStorage.removeItem("loggedInUid");
        window.location.href = "login.html";
      } catch (error) {
        console.error("Logout error:", error);

        message.textContent = "Could not log out. Please try again.";
        message.className = "form-message error-message";

        logoutButton.disabled = false;
        logoutButton.textContent = "Log Out";
      }
    });
  </script>

</body>
