<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171717">
  <title>A.D.M</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <main class="auth-card">
    <h1>Create Account</h1>
    <p class="subtitle">Register your student account</p>

    <form id="registerForm" novalidate>
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="At least 8 letters, numbers, or _"
             autocomplete="username" maxlength="30" required>
      <small id="usernameError" class="field-error"></small>

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Enter your email"
             autocomplete="email" required>
      <small id="emailError" class="field-error"></small>

      <label for="birthday">Birthday</label>
      <input type="date" id="birthday" required>
      <small id="birthdayError" class="field-error"></small>

      <label for="gender">Gender</label>
      <select id="gender" required>
        <option value="">-- Select Gender --</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
        <option value="Prefer not to say">Prefer not to say</option>
      </select>
      <small id="genderError" class="field-error"></small>

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Create a strong password"
             autocomplete="new-password" required>
      <small id="passwordError" class="field-error"></small>

      <div class="password-rules">
        <strong>Password requirements</strong>
        <ul>
          <li>At least 8 characters</li>
          <li>One uppercase and one lowercase letter</li>
          <li>One number and one special character</li>
          <li>No spaces</li>
        </ul>
      </div>

      <label for="confirmPassword">Confirm Password</label>
      <input type="password" id="confirmPassword" placeholder="Retype your password"
             autocomplete="new-password" required>
      <small id="confirmPasswordError" class="field-error"></small>

      <div class="terms-row">
        <input type="checkbox" id="terms">
        <label for="terms">I agree to the Terms and Conditions</label>
      </div>
      <small id="termsError" class="field-error"></small>

      <p id="formMessage" class="form-message" role="status" aria-live="polite"></p>
      <button id="registerButton" type="submit">Register</button>
      <button class="secondary-button" type="reset">Reset</button>
    </form>

    <p class="auth-link">Already have an account? <a href="login.html">Login here</a></p>
  </main>
  <script type="module" src="register.js"></script>
</body>
</html>
